name: Checks

on:
  pull_request:
  push:
    branches: [master, fizgig-advanced, test/caption-workbench, test/stream-sync]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r checks/requirements.txt
      - name: WebView2 browser-parity performance and hook regression checks
        run: python -m unittest discover -s checks -p test_webview2_performance.py -v
      - name: Caption Studio CPU optimization, lazy explorer and thumbnail cache
        run: |
          node checks/test_caption_cpu_perf.cjs
          python -m pytest checks/test_caption_thumbnail_cache.py -q
      - name: Caption Studio removal confirmation regression
        run: node checks/test_caption_remove_confirmation.cjs
      - name: Krea 2 direct auto discovery and manual concept probe regressions
        run: |
          python -m pytest checks/test_krea2_direction_edit_v2.py -k "scan_adds_auto_targets_to_manual or manual_target_is_kept_even_if_scan_does_not_show_suppression or manual_probe_keeps_weak_concept_not_strong_or_inconsistent or manual_target_without_any_caption_is_measured_against_controls or manual_target_survives_when_automatic_scan_cannot_fit or auto_selection_prefers_frequent_confirmed_targets or frequent_auto_pool_excludes_uncommon_tags_but_keeps_manual_tags or direct_auto_candidate_pool_uses_frequency_only or direct_auto_final_order_ignores_caption_frequency or direct_auto_only_preliminary_caption_sampling" -q
          python -m pytest checks/test_krea2_calibration_lifecycle.py -k "auto_target_budget_is_four_percent or fresh_calibration_reads_family_options" -q
      - name: Send-only stream synchronization, ring sizing and replay regression checks
        run: python -m pytest checks/test_send_only_swap.py checks/test_krea2_global_replay.py -q
      - name: Mask weights in Global Replay and H3 reference distillation
        run: |
          python -m pytest checks/test_krea2_global_replay.py -k "masked_global_replay" -q
          python -m pytest checks/test_minimax_masks.py -k "reference_distillation_respects_still_mask" -q
      - name: Upstream captioner header and video-only mask integration regressions
        run: python -m pytest checks/test_captioner_header_guard.py checks/test_clips_only_masks.py -q
      - name: Shared safetensors header safeguards (upstream 9ac00cd)
        run: python -m pytest checks/test_safetensors_header_guard.py -q
      - name: Offline tokenizer and partial-cache recovery (upstream #397)
        run: python -m pytest checks/test_offline_tokenizers.py -q
      - name: Krea 2 text encoder release avoids CPU weight copy (upstream #380)
        run: python -m pytest checks/test_krea2_te_release.py -q
      - name: Studio and Royale edit-reference native shape (upstream 43c88d8)
        run: python -m pytest checks/test_edit_reference_size.py -q
      - name: MiniMax H3 Image optional half-size speed boost (upstream 5b81d3f)
        run: python -m pytest checks/test_h3_image_speed_boost.py -q
      - name: Frankenstein base-model blending and export (upstream v9.8.3)
        run: python -m pytest checks/test_frankenstein_blend.py -q
      - name: H3 Frankenstein Studio bridge and simulated low-memory planner
        run: python -m pytest checks/test_frankenstein_studio_bridge.py -q
      - name: CPU streamed multi-family checkpoint mixing (MOSS, Anima, Krea 2, SDXL)
        run: python -m pytest checks/test_checkpoint_mix.py -q
      - name: Global Replay step-count and epoch-progress regression checks
        run: |
          python -m pytest checks/test_replay_step_progress.py -q
          node checks/test_replay_step_progress.cjs
      - name: Save cadence rolling-best toggle UI wiring
        run: node checks/test_save_best_cadence.cjs
      - name: Rolling best checkpoint scores and CLI
        run: python -m pytest checks/test_best_checkpoint.py -q
      - name: Cache preflight and resume cache integrity
        run: python -m pytest checks/test_cache_preflight.py checks/test_resume_cache_skip.py -q
      - name: Compile Caption Studio changed Python modules
        run: |
          python -m py_compile src/fizgig/families/loss_watch.py src/fizgig/families/train.py src/fizgig/dataset/image_dataset.py
          python -m py_compile src/fizgig/web/server.py src/fizgig/web/image_loss.py src/fizgig/web/image_edit.py src/fizgig/web/caption_review.py src/fizgig/web/caption_batch_edit.py src/fizgig/web/captions.py src/fizgig/web/removed_images.py src/fizgig/web/caption_duplicates.py src/fizgig/families/trigger_check.py src/fizgig/scripts/batch_caption.py src/fizgig/scripts/translate_captions.py
      - name: Web UI scripts parse
        run: for f in src/fizgig/web/static/*.js; do node --check "$f"; done
      - name: Studio cross-tab ownership and preview isolation regressions (#395)
        run: |
          python -m pytest checks/test_studio_tab_ownership.py -q
          node checks/test_studio_tab_ownership.cjs
      - name: Studio primary hot-swap and render metadata regression (#394)
        run: python -m pytest checks/test_studio_primary_swap_advanced.py -q
      - name: Stop/pause lifecycle boundary regression
        run: python -m pytest checks/test_stop_stage_boundary.py checks/test_stop_paused.py -q
      - name: AMD MIOpen opt-in and Windows DB fallback (#389)
        run: python -m pytest checks/test_rocm_miopen_switch.py -q
      - name: All browser scripts are served by HTTP routes
        run: node checks/test_web_static_routes.cjs
      - name: Caption Studio tag-query unit checks
        run: node checks/test_caption_studio_tags.cjs
      - name: Caption Studio constellation and waterfall regression checks
        run: node checks/test_caption_studio_viz.cjs
      - name: Caption Studio cross-view selection regression checks
        run: node checks/test_caption_studio_selection.cjs
      - name: Caption sidebar TagBench layout keeps Explorer modes
        run: node checks/test_caption_sidebar_layout.cjs
      - name: Caption thumbnail rail retained DOM and native scroll
        run: node checks/test_caption_thumb_rail.cjs
      - name: Caption Studio validation/sample context menu checks
        run: node checks/test_caption_studio_training_picks.cjs
      - name: Caption Studio shared image editor wiring checks
        run: node checks/test_caption_studio_image.cjs
      - name: Image Prep glass overlay lifecycle and shared editor regression
        run: node checks/test_prep_glass_editor.cjs
      - name: Caption Settings switch and disclosure UX
        run: node checks/test_caption_settings_ui.cjs
      - name: Image editor paint and resize performance regressions
        run: node checks/test_mask_editor_performance.cjs
      - name: Remove brush cursor and composited preview regressions
        run: node checks/test_remove_preview_latency.cjs
      - name: Tiled history, bounded previews and asynchronous encoding
        run: node checks/test_caption_image_perf.cjs
      - name: Background Remove worker bridge and patch safety
        run: node checks/test_remove_worker_bridge.cjs
      - name: Serial asynchronous mask saves preserve newer edits
        run: node checks/test_mask_async_save.cjs
      - name: TagBench duplicate finder preserves native LaMa removal wiring
        run: node checks/test_caption_studio_duplicates.cjs
      - name: PNG upright dimensions without decode regression
        run: python -m pytest checks/test_upright_orientation.py -q
      - name: Caption Studio regression checks
        run: python -m pytest checks/test_caption_studio_sync.py checks/test_caption_live_images.py checks/test_live_dataset_admission.py checks/test_live_reference_pairs.py checks/test_h3_live_media.py checks/test_caption_live_masks.py checks/test_caption_review.py checks/test_caption_batch_edit.py checks/test_caption_removed_images.py checks/test_caption_duplicates.py checks/test_caption_formats.py checks/test_image_edit.py checks/test_batch_training.py checks/test_lora_regularisation.py -q
      # The full upstream suite is run separately; this workflow keeps UI
      # checks and the Krea 2 mixed-target regression fast and focused.

  windows_webview2_diag:
    name: Windows WebView2 diagnostic smoke
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse and run read-only WebView2 diagnostic
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/diagnose_webview2.ps1"),
            [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
          & .\scripts\diagnose_webview2.ps1
