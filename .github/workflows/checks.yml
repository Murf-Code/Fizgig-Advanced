name: Checks

on:
  pull_request:
  push:
    branches: [master, test/caption-workbench]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r checks/requirements.txt
      - name: Compile Caption Studio changed Python modules
        run: |
          python -m py_compile src/fizgig/families/loss_watch.py src/fizgig/families/train.py
          python -m py_compile src/fizgig/web/server.py src/fizgig/web/image_loss.py src/fizgig/web/image_edit.py src/fizgig/web/caption_review.py
      - name: Web UI scripts parse
        run: for f in src/fizgig/web/static/*.js; do node --check "$f"; done
      - name: Caption Studio tag-query unit checks
        run: node checks/test_caption_studio_tags.cjs
      - name: Caption Studio regression checks
        run: python -m pytest checks/test_caption_studio_sync.py checks/test_caption_live_images.py checks/test_caption_live_masks.py checks/test_caption_review.py checks/test_caption_formats.py checks/test_image_edit.py -q
      # The upstream full suite is blocked by pre-existing syntax errors in
      # src/fizgig/krea2/direction_edit_v2.py (unchanged from wip-test).
      # Run the full suite after that baseline module is repaired.
